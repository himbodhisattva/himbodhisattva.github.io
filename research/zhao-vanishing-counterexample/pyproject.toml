[project]
name = "zhao-vanishing-counterexample"
version = "0.1.0"
description = "Exact construction and verification of a quartic counterexample to Zhao's Vanishing Conjecture"
requires-python = ">=3.11"
dependencies = [
    "sympy==1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
