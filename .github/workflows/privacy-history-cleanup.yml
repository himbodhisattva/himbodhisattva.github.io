name: one-time privacy history cleanup

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete records for rewritten commits
        uses: actions/github-script@v9
        with:
          script: |
            const staleRunIds = [
              29804063098, 29802147097, 29790911706, 27780556381,
              27438695807, 27438525623, 27376625966, 27376314015,
              27376222457, 27376218741, 27366837481, 27366780733,
              27366726958, 27366567779, 27366230139, 27366000403,
              27356171874, 27355474291, 27354436110, 27353276504,
              27353200485, 27353158137,
            ];
            const staleDeploymentIds = [
              5533269478, 5532926929, 5530939421, 5113591326,
              5040064863, 5040026323, 5026510649, 5026446220,
              5026424325, 5024418616, 5024405849, 5024394490,
              5024360167, 5024289197, 5024242815, 5022074616,
              5021924280, 5021689460, 5021430888, 5021413513,
              5021407002,
            ];

            const {owner, repo} = context.repo;
            const failures = [];

            for (const deployment_id of staleDeploymentIds) {
              try {
                await github.request(
                  "DELETE /repos/{owner}/{repo}/deployments/{deployment_id}",
                  {owner, repo, deployment_id},
                );
              } catch (error) {
                if (error.status === 422) {
                  await github.request(
                    "POST /repos/{owner}/{repo}/deployments/{deployment_id}/statuses",
                    {owner, repo, deployment_id, state: "inactive"},
                  );
                  await github.request(
                    "DELETE /repos/{owner}/{repo}/deployments/{deployment_id}",
                    {owner, repo, deployment_id},
                  );
                } else if (error.status !== 404) {
                  failures.push(`deployment ${deployment_id}: ${error.status}`);
                }
              }
            }

            for (const run_id of staleRunIds) {
              try {
                await github.request(
                  "DELETE /repos/{owner}/{repo}/actions/runs/{run_id}",
                  {owner, repo, run_id},
                );
              } catch (error) {
                if (error.status !== 404) {
                  failures.push(`run ${run_id}: ${error.status}`);
                }
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join("\n"));
            } else {
              core.info(
                `Deleted ${staleDeploymentIds.length} deployments and ` +
                `${staleRunIds.length} workflow runs.`,
              );
            }
